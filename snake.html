<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        html {
            height: 100%;
        }

        .link-section {
            background-color: #0000FF;
            color: white;
            padding: 10px 20px;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .social-links a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 20px;
        }

        .social-links a:hover {
            opacity: 0.8;
        }

        .header-section {
            background-color: #FF7F50;
            padding: 20px;
            text-align: center;
        }

        .aside-left {
            background-color: #FFFF00;
            min-height: 500px;
            padding: 20px;
        }

        .main-content {
            background-color: #5DADE2;
            flex: 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 100%;
            width: 100%;
        }

        canvas {
            border: 3px solid #000;
            background-color: #000;
            max-width: 90vh;
            max-height: 90vh;
            aspect-ratio: 1;
        }

        .game-info {
            color: #000;
            font-size: 18px;
            font-weight: bold;
        }

        .game-controls {
            color: #000;
            font-size: 14px;
            text-align: center;
        }

        .btn-game {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
        }

        .aside-right {
            background-color: #FF69B4;
            min-height: 500px;
            padding: 20px;
        }

        .footer-section {
            background-color: #90EE90;
            padding: 20px;
            text-align: center;
        }

        .container-fluid {
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .row {
            display: flex;
            flex: 1;
            height: 100%;
        }

        main {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .aside-left,
        .aside-right {
            background-color: #FF69B4;
            min-height: 500px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark link-section">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Site</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="ms-auto social-links">
                    <a href="mailto:contact@example.com" title="Email">Email</a>
                    <a href="tel:+1234567890" title="Phone">Phone</a>
                    <a href="#" title="LinkedIn">LinkedIn</a>
                    <a href="#" title="Twitter">Twitter</a>
                    <a href="#" title="GitHub">GitHub</a>
                    <a href="contact.html" title="Contact">Contact</a>
                    <a href="snake.html" title="Snake">Snake</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="header-section">
        <h2>Header</h2>
    </header>

    <!-- Main Content Row -->
    <main class="container-fluid">
        <div class="row g-0">
            <!-- Aside Left -->
            <aside class="col-md-2 aside-left">
                <h3>Aside 1</h3>
            </aside>

            <!-- Main Content -->
            <section class="col-md-8 main-content">
                <div class="game-container">
                    <div class="game-info">
                        Score: <span id="score">0</span>
                    </div>
                    <canvas id="gameCanvas" width="400" height="400"></canvas>
                    <div class="game-controls">
                        <p>Use Arrow Keys or WASD to move</p>
                        <button class="btn btn-primary btn-game" onclick="resetGame()">Start Game</button>
                    </div>
                </div>
            </section>

            <!-- Aside Right -->
            <aside class="col-md-2 aside-right">
                <h3>Aside 2</h3>
            </aside>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="footer-section">
        <h2>Footer</h2>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 0;
        let gameRunning = true;
        let lastUpdateTime = 0;
        const gameSpeed = 100; // milliseconds between updates

        function drawRect(x, y, size, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * gridSize, y * gridSize, size, size);
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                drawRect(segment.x, segment.y, gridSize, index === 0 ? '#00FF00' : '#00AA00');
            });
        }

        function drawFood() {
            drawRect(food.x, food.y, gridSize, '#FF0000');
        }

        function drawGame() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawSnake();
            drawFood();
        }

        function updateGame() {
            if (!gameRunning) return;

            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameRunning = false;
                alert('Game Over! Final Score: ' + score);
                return;
            }

            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameRunning = false;
                alert('Game Over! Final Score: ' + score);
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } else {
                snake.pop();
            }
        }

        function gameLoop(currentTime) {
            if (currentTime - lastUpdateTime > gameSpeed) {
                updateGame();
                lastUpdateTime = currentTime;
            }

            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function handleKeyPress(e) {
            const key = e.key.toLowerCase();
            switch (key) {
                case 'arrowup':
                case 'w':
                    if (dy === 0) { nextDx = 0; nextDy = -1; }
                    break;
                case 'arrowdown':
                case 's':
                    if (dy === 0) { nextDx = 0; nextDy = 1; }
                    break;
                case 'arrowleft':
                case 'a':
                    if (dx === 0) { nextDx = -1; nextDy = 0; }
                    break;
                case 'arrowright':
                case 'd':
                    if (dx === 0) { nextDx = 1; nextDy = 0; }
                    break;
            }
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            food = { x: 15, y: 15 };
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            scoreDisplay.textContent = score;
            gameRunning = true;
            lastUpdateTime = 0;
            drawGame();
        }

        document.addEventListener('keydown', handleKeyPress);

        // Start smooth game loop with requestAnimationFrame
        drawGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>

</html>
