<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .link-section {
            background-color: #0000FF;
            color: white;
            padding: 10px 20px;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .social-links a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 20px;
        }

        .social-links a:hover {
            opacity: 0.8;
        }

        .header-section {
            background-color: #FF7F50;
            padding: 20px;
            text-align: center;
        }

        .aside-left {
            background-color: #FFFF00;
            min-height: 500px;
            padding: 20px;
        }

        .main-content {
            background-color: #5DADE2;
            min-height: 500px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-content p {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.6;
        }

        .aside-right {
            background-color: #FF69B4;
            min-height: 500px;
            padding: 20px;
        }

        .footer-section {
            background-color: #90EE90;
            padding: 20px;
            text-align: center;
        }

        .container-fluid {
            padding: 0;
        }
    </style>
</head>

<body>
    <!-- Header Section -->
    <header class="header-section">
        <h2>Header</h2>
    </header>

    <!-- Main Content Row -->
    <main class="container-fluid">
        <div class="row g-0">

            <!-- Main Content -->
            <section class="col-md-8 main-content">
                <p>Call me gng</p>
            </section>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="footer-section">
        <h2>Footer</h2>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
